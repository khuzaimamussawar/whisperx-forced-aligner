# Auto-build and push to Docker Hub on every push to main

name: Build & Push Docker Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # Allow manual trigger from GitHub UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          # Code-only update on top of the last working July image (see Dockerfile.update for why).
          # To rebuild everything from scratch, use `file: Dockerfile` after pinning whisperX and torch.
          file: Dockerfile.update
          build-args: |
            BASE_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/whisperx-forced-aligner:f0c54454dcbbafe04d6aab0640645e52db91cac7
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/whisperx-forced-aligner:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/whisperx-forced-aligner:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
